workflows:
  medcin-ios-testflight:
    name: Medcin iOS TestFlight build 2
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: flutter-app
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.drimaneelmakhloufi.medcin
        APP_STORE_VERSION: 1.0
        APP_STORE_BUILD_NUMBER: 2
        API_BASE_URL: https://app.drimaneelmakhloufi.com/api
        PUSHER_APP_KEY: 9cdaa8fc04899249c290
        PUSHER_CLUSTER: eu
        PUSHER_AUTH_ENDPOINT: https://app.drimaneelmakhloufi.com/api/broadcasting/auth
        ONESIGNAL_APP_ID: 6ed7f0a9-9a7e-44b7-8517-59eb770c489f
      flutter: stable
      xcode: 27.0
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificates
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA with Xcode 27
        script: |
          flutter build ipa --release \
            --build-name="$APP_STORE_VERSION" \
            --build-number="$APP_STORE_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=PUSHER_APP_KEY="$PUSHER_APP_KEY" \
            --dart-define=PUSHER_CLUSTER="$PUSHER_CLUSTER" \
            --dart-define=PUSHER_AUTH_ENDPOINT="$PUSHER_AUTH_ENDPOINT" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - flutter-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
